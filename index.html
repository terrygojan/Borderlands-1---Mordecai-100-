<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Armas Legendarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #201b14;
    --bg-2: #0c0a07;
    --panel: rgba(20, 17, 12, 0.82);
    --panel-border: #3a3324;
    --card-bg: #221d16;
    --card-bg-hover: #2c2519;
    --card-border: #3a3324;
    --text-primary: #f2ecdd;
    --text-secondary: #a99f8b;
    --text-faint: #6f6957;
    --accent-gold: #e8b54b;
    --accent-blue: #4fc3f7;
    --accent-green: #7bc96f;
    --accent-violet: #9b7bf0;
    --accent-deepblue: #4d7fe0;
    --accent-grey: #7b7566;
    --status-obtained-bg: #2c4a30;
    --status-obtained-fg: #8fdc9a;
    --status-missing-bg: #3a352b;
    --status-missing-fg: #b3ab98;
    --radius-column: 14px;
    --radius-card: 10px;
    --font-display: 'Bangers', cursive;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-title: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: 'Roboto Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--text-primary);
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #423824 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, #34281a 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
  }

  /* ---------- Pantalla de carga ---------- */
  #dropScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .drop-card {
    max-width: 560px;
    width: 100%;
    background: var(--panel);
    border: 1.5px dashed #55492e;
    border-radius: 18px;
    padding: 40px 34px;
    text-align: center;
    transition: border-color .15s ease, background .15s ease;
  }

  .drop-card.drag-over {
    border-color: var(--accent-gold);
    background: rgba(232, 181, 75, 0.08);
  }

  .drop-title {
    font-family: var(--font-display);
    font-size: 34px;
    letter-spacing: 1px;
    color: var(--accent-gold);
    margin: 0 0 6px;
    text-shadow: 0 2px 0 rgba(0,0,0,.4);
  }

  .drop-sub {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0 0 26px;
    line-height: 1.5;
  }

  .drop-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    opacity: .8;
  }
